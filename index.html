<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010"><meta name="description" content="Offline job application helper"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>QuickApply</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#0c0c0c;color:#f5f5f5}*{box-sizing:border-box}body{margin:0;padding:24px 16px}main{max-width:580px;margin:auto}header{display:flex;align-items:center;gap:12px;margin:12px 0 26px}.logo{background:#f5f5f5;color:#111;padding:12px;border-radius:15px;font-weight:900}h1{font-size:25px;margin:0}p{color:#aaa;font-size:14px;line-height:1.5}section{border:1px solid #303030;border-radius:18px;padding:18px;margin:16px 0;background:#171717}label{display:block;font-size:13px;font-weight:650;margin:14px 0 7px}input,textarea{width:100%;background:#0e0e0e;color:white;border:1px solid #404040;border-radius:10px;padding:12px;font:inherit;font-size:15px}textarea{min-height:225px;resize:vertical;line-height:1.5}input[type=file]{font-size:13px}button{border:0;border-radius:12px;padding:14px 16px;font:inherit;font-weight:700;cursor:pointer;width:100%;margin:5px 0;background:#f5f5f5;color:#111}button.secondary{background:#303030;color:#fff}button:disabled{opacity:.4}small{color:#999}#status{min-height:24px;color:#cfcfcf;font-size:13px}footer{text-align:center;margin-top:28px}.tag{font-size:12px;color:#9f9f9f}
</style></head><body><main><header><div class="logo">QA</div><div><h1>QuickApply</h1><div class="tag">Your job application, ready in seconds.</div></div></header><section><label for="to">Recruiter's email</label><input id="to" type="email" autocomplete="email" placeholder="hr@company.co.za"><label for="subject">Subject</label><input id="subject"><label for="message">Your message</label><textarea id="message"></textarea><label for="cv">Your CV (PDF)</label><input id="cv" type="file" accept=".pdf,application/pdf"><p id="cvStatus">No CV saved yet.</p><button id="share">Share CV to Gmail / email app</button><button id="compose" class="secondary">Open email with subject + message</button><button id="copy" class="secondary">Copy message</button><p id="status" role="status" aria-live="polite"></p></section><footer><small>Stored on this device only. No account or server.</small></footer></main><script>
const $=id=>document.getElementById(id);const defaults={subject:'Job Opportunity Enquiry',message:"Good day,\n\nI hope you're doing well.\n\nI sincerely apologise for reaching out unexpectedly. I'm currently looking for employment and would be truly grateful if you could consider me for any available opportunities within your company.\n\nI've attached my CV for your consideration.\n\nThank you so much for your time. I would really appreciate any opportunity.\n\nKind regards,\nSipho"};
for(const id of ['subject','message']){$(id).value=localStorage.getItem('qa_'+id)??defaults[id];$(id).addEventListener('input',()=>localStorage.setItem('qa_'+id,$(id).value));}
const status=s=>$('status').textContent=s;
function db(){return new Promise((resolve,reject)=>{const req=indexedDB.open('quickapply',1);req.onupgradeneeded=()=>req.result.createObjectStore('files');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function getCV(){const d=await db();return new Promise((resolve,reject)=>{const t=d.transaction('files','readonly');const r=t.objectStore('files').get('cv');r.onsuccess=()=>{resolve(r.result);d.close()};r.onerror=()=>reject(r.error)});}
async function saveCV(file){const d=await db();return new Promise((resolve,reject)=>{const t=d.transaction('files','readwrite');t.objectStore('files').put(file,'cv');t.oncomplete=()=>{d.close();resolve()};t.onerror=()=>reject(t.error)});}
async function showCV(){try{const f=await getCV();$('cvStatus').textContent=f?'Saved: '+f.name:'No CV saved yet.'}catch{$('cvStatus').textContent='Could not access local CV storage.'}}
$('cv').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;if(f.type!=='application/pdf'&&!f.name.toLowerCase().endsWith('.pdf')){status('Please choose a PDF.');return}try{await saveCV(f);await showCV();status('CV saved on this device.')}catch{status('Could not save CV. Check browser storage settings.')}});
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('message').value);status('Message copied. Paste it into Gmail.')}catch{status('Copy failed. Select the message and copy manually.')}};
$('compose').onclick=()=>{const to=$('to').value.trim();if(to&&!$('to').checkValidity()){status('Please enter a valid email address.');return}const url='mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent($('subject').value)+'&body='+encodeURIComponent($('message').value);location.href=url;status('Attach your saved CV manually in Gmail.');};
$('share').onclick=async()=>{let f;try{f=await getCV()}catch{status('Could not read your saved CV.');return}if(!f){status('Choose and save your CV PDF first.');return}const file=new File([f],f.name||'CV.pdf',{type:'application/pdf'});if(!navigator.share||!navigator.canShare?.({files:[file]})){status('File sharing is not supported here. Use Open email and attach your CV manually.');return}try{await navigator.share({files:[file],title:$('subject').value,text:$('message').value});status('Shared to your selected app. Check the recipient, message and attachment before sending.')}catch(e){if(e.name!=='AbortError')status('Sharing failed. Try Open email instead.')}};
showCV();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
